# Dokploy-ready Docker Compose for ARTEX.
#
# Deploy with: Dokploy → Create Service → Docker Compose
#   Repository : an1ndra/ARTEX
#   Branch     : main
#   Compose Path: docker-compose.dokploy.yml
#
# Differences from the upstream docker-compose.yml (which cannot be used as-is on a PaaS):
#   * `build:` instead of the upstream `autumn27/artex` image — that image is built from the
#     Chinese upstream source; this fork's Dockerfile builds the English fork from source.
#   * named volumes instead of ./data and ./skills bind mounts — Dokploy re-clones the repo on
#     every deploy, so bind mounts into the checkout are not durable.
#   * no published host ports: the app is reached through Traefik on dokploy-network. The
#     traffic-recording proxy (:8788) stays private inside the container on purpose.
#   * Traefik labels are declared here, so the public host is driven by ARTEX_HOST.
#
# Everything is configured through Dokploy's Environment tab (paste .env.dokploy.example).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the Dokploy environment}
      POSTGRES_DB: ${POSTGRES_DB:-artex}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artex} -d ${POSTGRES_DB:-artex}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      - internal

  artex:
    build:
      context: .
      dockerfile: Dockerfile.dokploy
      target: ${ARTEX_BUILD_TARGET:-runtime}
      args:
        ARTEX_VERSION: ${ARTEX_VERSION:-0.4.0}
    image: artex-dokploy:${ARTEX_VERSION:-0.4.0}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # DSN beats config.json (which does not exist in the image).
      ARTEX_PG_DSN: postgres://${POSTGRES_USER:-artex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-artex}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARTEX_LLM_PROVIDER: ${ARTEX_LLM_PROVIDER:-}
      ARTEX_LLM_MODEL: ${ARTEX_LLM_MODEL:-}
      ARTEX_LLM_BASE_URL: ${ARTEX_LLM_BASE_URL:-}
      ARTEX_LLM_PROXY: ${ARTEX_LLM_PROXY:-}
    volumes:
      # jwt.key, SQLite stores, task artifacts. Must survive redeploys.
      - artex-data:/app/data
      # JWT signing key lives outside the agent-browsable workspace but must also persist,
      # otherwise each redeploy logs everyone out.
      - artex-state:/app/.state
    expose:
      - "8787"
    # The MITM traffic proxy is intentionally NOT published. Uncomment only if you want to
    # point external tools at it, and bind it to loopback on the host.
    # ports:
    #   - "127.0.0.1:8788:8788"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8787/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    networks:
      - internal
      - dokploy-network
    labels:
      traefik.enable: "true"
      traefik.docker.network: dokploy-network
      # HTTP → HTTPS redirect
      traefik.http.middlewares.artex-redirect.redirectscheme.scheme: https
      traefik.http.routers.artex-http.rule: Host(`${ARTEX_HOST:-artex.localhost}`)
      traefik.http.routers.artex-http.entrypoints: web
      traefik.http.routers.artex-http.middlewares: artex-redirect
      # HTTPS router. SSE (/api/.../events) is served by the same backend port; Traefik streams
      # it without buffering, no extra configuration needed.
      traefik.http.routers.artex.rule: Host(`${ARTEX_HOST:-artex.localhost}`)
      traefik.http.routers.artex.entrypoints: websecure
      traefik.http.routers.artex.tls.certresolver: ${ARTEX_CERT_RESOLVER:-letsencrypt}
      traefik.http.services.artex.loadbalancer.server.port: "8787"

volumes:
  pgdata:
  artex-data:
  artex-state:

networks:
  internal:
    internal: false
  dokploy-network:
    external: true
